<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glasstap</title>
<style>
:root {
  /* Native controls, such as the iPhone picker, follow the dark page. */
  color-scheme: dark;
  --bg: #0e0f11;
  --surface: #1a1c20;
  --surface-hover: #24272c;
  --border: #2c2f35;
  --fg: #e8e9eb;
  --muted: #8b9098;
  --accent: #4c8dff;
  --live: #34c759;
  --warn: #ff9f0a;
  --bad: #ff453a;
  --radius: 12px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  display: flex; flex-direction: column; overflow: hidden;
}
.stage {
  flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
  gap: 20px; padding: 16px;
}

/* Phone */
.device {
  height: 100%; max-height: calc(100vh - 72px); padding: 9px; border-radius: 54px;
  background: #050505; border: 1px solid var(--border);
  box-shadow: 0 0 0 4px #121316, 0 24px 60px rgba(0,0,0,.55);
}
#wrap { position: relative; height: 100%; aspect-ratio: 393 / 852; border-radius: 45px; overflow: hidden; background: #000; }
#screen {
  display: block; width: 100%; height: 100%; cursor: pointer; touch-action: none;
  user-select: none; -webkit-user-drag: none;
}
#overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.ripple {
  position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; pointer-events: none;
  background: rgba(255,255,255,.35); border: 2px solid rgba(255,255,255,.8);
  animation: ripple .45s ease-out forwards;
}
.ripple.hold { background: rgba(76,141,255,.35); border-color: var(--accent); }
@keyframes ripple { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.3); opacity: 0; } }
.trail { stroke: rgba(255,255,255,.75); stroke-width: 5; stroke-linecap: round; fill: none; animation: fade .5s ease-out forwards; }
@keyframes fade { to { opacity: 0; } }
#paused {
  position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
  padding: 32px; background: rgba(0,0,0,.72); color: var(--fg); font-size: 15px; backdrop-filter: blur(6px);
}
#paused button { margin-top: 14px; }
/* A banner, not a cover: after a wake, the passcode keypad shows and must stay tappable. */
#locked {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: none; align-items: center; gap: 10px;
  padding: 6px 6px 6px 14px; border-radius: 999px; background: rgba(0,0,0,.78); color: var(--fg); font-size: 13px;
  white-space: nowrap; backdrop-filter: blur(6px);
}

/* Toolbar */
.toolbar { display: flex; flex-direction: column; gap: 8px; width: 210px; }
.group { display: flex; flex-direction: column; gap: 4px; padding: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.group-title { padding: 4px 8px 2px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
button {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px;
  background: transparent; color: var(--fg); font: inherit; text-align: left; cursor: pointer;
}
button:hover { background: var(--surface-hover); }
button:active { transform: translateY(1px); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
button .label { flex: 1; }
kbd {
  min-width: 20px; padding: 1px 6px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px;
  color: var(--muted); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; text-align: center;
}
.primary { width: auto; margin: 14px auto 0; background: var(--accent); color: #fff; justify-content: center; padding: 8px 16px; }
.primary:hover { background: #3a7bf0; }
.typebox { display: flex; gap: 6px; padding: 4px; }
.typebox input {
  flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg); color: var(--fg); font: inherit;
}
.typebox button { width: auto; padding: 8px 10px; }
.hint { padding: 2px 8px 4px; color: var(--muted); font-size: 11.5px; }
#picker { margin: 2px 4px 4px; font: inherit; }
/* The picker group is a flex box, which would otherwise show while hidden. */
[hidden] { display: none !important; }

/* Status bar */
.status {
  display: flex; align-items: center; gap: 14px; padding: 8px 16px; border-top: 1px solid var(--border);
  background: var(--surface); color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden;
}
.status b { color: var(--fg); font-weight: 500; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: none; }
.dot.live { background: var(--live); box-shadow: 0 0 0 3px rgba(52,199,89,.18); }
.dot.bad { background: var(--bad); }
#action.error { color: var(--bad); }
.spacer { flex: 1; }

@media (max-width: 720px) {
  body { overflow: auto; }
  /* Start at the top. A centered column taller than the window cuts off its top. */
  .stage { flex: none; flex-direction: column; justify-content: flex-start; }
  .device { height: 70vh; }
  .toolbar { width: 100%; max-width: 420px; }
}
</style>
</head>
<body>
<main class="stage">
  <div class="device">
    <div id="wrap">
      <canvas id="screen"></canvas>
      <svg id="overlay"></svg>
      <div id="paused"><div>Another viewer took the stream.<br>
        <button class="primary" onclick="location.reload()">Take it back</button></div></div>
      <div id="locked"><span id="lockedText"></span>
        <button class="primary" id="wakeNow">Wake screen</button></div>
    </div>
  </div>

  <aside class="toolbar">
    <div class="group" id="pickerGroup" hidden>
      <div class="group-title">iPhone</div>
      <select id="picker" title="Choose the iPhone to show and control"></select>
    </div>

    <div class="group">
      <div class="group-title">Navigate</div>
      <button id="home" title="Go to the home screen">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
        <span class="label">Home</span><kbd>H</kbd></button>
      <button id="back" title="Swipe from the left edge">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
        <span class="label">Back</span><kbd>B</kbd></button>
      <button id="switcher" title="Swipe up from the bottom and hold">
        <svg viewBox="0 0 24 24"><rect x="3" y="6" width="8" height="12" rx="2"/><rect x="13" y="6" width="8" height="12" rx="2"/></svg>
        <span class="label">App switcher</span><kbd>S</kbd></button>
      <button id="wake" title="Wake the screen. A passcode, if set, stays for you to enter.">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span class="label">Wake screen</span><kbd>W</kbd></button>
    </div>

    <div class="group">
      <div class="group-title">Keyboard</div>
      <div class="typebox">
        <input id="txt" placeholder="Type text…" autocomplete="off" spellcheck="false">
        <button id="send" title="Send the text. Enter on an empty field presses Return.">
          <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
      <div class="hint">Press <kbd>/</kbd> to focus. Enter sends.</div>
    </div>

    <div class="group">
      <div class="group-title">Capture</div>
      <button id="shot" title="Save a full-resolution PNG of the screen">
        <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        <span class="label">Screenshot</span><kbd>P</kbd></button>
    </div>

    <div class="hint">Click to tap. Drag to swipe. Hold for a long press. Scroll to scroll.</div>
  </aside>
</main>

<footer class="status">
  <span id="dot" class="dot"></span><b id="state">Connecting…</b>
  <span id="devname"></span>
  <span id="fps"></span>
  <span id="rate"></span>
  <span id="fmt"></span>
  <span class="spacer"></span>
  <span id="action"></span>
</footer>

<script>
// The app opens this page with #token=. Every request must carry it. A URL
// fragment never goes to a server, so the token stays out of request logs.
// &device= names one iPhone. Without it, the page uses the only iPhone, or asks which one.
const params = new URLSearchParams(location.hash.slice(1));
const TOKEN = params.get('token') || '';
// The video comes on its own port, so that taps never wait behind the stream.
// The server fills in the port. The host stays this page's own, so a tunnel works unchanged.
const VIDEO_ORIGIN = 'http://' + location.hostname + ':' + '__VIDEO_PORT__';
const auth = { 'X-Glasstap': TOKEN };
const $ = id => document.getElementById(id);
const img = $('screen'), overlay = $('overlay');
let size = { width: 393, height: 852 }, down = null, count = 0;
// null, 'locked' (WDA can wake the screen) or 'unlock' (only the user at the iPhone can unlock it).
let locked = null;

// The chosen iPhone, as the id in its paths (/devices/<id>/…). null while there is none.
let device = null, devices = [];
// A new choice ends the stream of the old one.
let generation = 0, reader = null, videoRunning = false;
const path = p => '/devices/' + encodeURIComponent(device) + p;
// The list entry of an id. A page can still hold the capture id after the app has learned the UDID.
const entry = id => devices.find(d => d.udid === id || d.captureID === id);

// Keep the choice in the link, so that a reload and "Take it back" stay on this iPhone.
function remember(id) {
  const p = new URLSearchParams(location.hash.slice(1));
  if (id) p.set('device', id); else p.delete('device');
  history.replaceState(null, '', '#' + p.toString());
}

// Ends the stream of the old choice. With an id, connects to that iPhone.
function chooseDevice(id) {
  if (id === device) return;
  device = id;
  remember(id);
  showDevices();
  generation++;
  if (reader) reader.cancel().catch(() => {});
  $('paused').style.display = 'none';
  setLocked(null);
  if (!id) return;
  status('', 'Connecting…');
  if (!videoRunning) video();
}

// The list of iPhones. The picker shows only with more than one. An unchanged list is not drawn
// again, so that an open picker stays open. Returns true if the list changed.
let listText = null;
async function loadDevices() {
  const r = await fetch('/devices', { headers: auth });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const text = await r.text();
  if (text === listText) return false;
  listText = text;
  devices = JSON.parse(text);
  showDevices();
  return true;
}
function showDevices() {
  const picker = $('picker');
  $('pickerGroup').hidden = devices.length < 2;
  const current = device && entry(device);
  const options = devices.map(d => {
    const o = document.createElement('option');
    o.value = d.udid; o.textContent = d.name;
    return o;
  });
  if (!current) options.unshift(Object.assign(document.createElement('option'), { value: '', textContent: 'Choose an iPhone', disabled: true }));
  picker.replaceChildren(...options);
  picker.value = current ? current.udid : '';
  $('devname').textContent = current ? current.name : '';
}
$('picker').onchange = e => chooseDevice(e.target.value);

// Matches the choice with the list. A learned UDID replaces the capture id, with no new connection.
// If the chosen iPhone is gone, the only other iPhone takes its place. With more, the page asks.
function reconcile() {
  const current = device && entry(device);
  if (current) {
    if (current.udid !== device) { device = current.udid; remember(device); showDevices(); }
    return;
  }
  if (devices.length === 1) return chooseDevice(devices[0].udid);
  chooseDevice(null);
  status('bad', devices.length ? 'Choose an iPhone' : 'No iPhone is connected');
  $('fps').textContent = ''; $('rate').textContent = '';
}

async function syncDevices() {
  let changed;
  try { changed = await loadDevices(); } catch (e) {
    if (!device) status('bad', 'Cannot list the iPhones (' + e.message + '), retrying…');
    return false;
  }
  reconcile();
  return changed;
}

// After the first read, the page reads the list only while it needs it: while no iPhone is chosen,
// and while the picker shows. The wait grows to 10 s while the list stays the same. With one chosen iPhone, the stream
// tells instead: it ends when the iPhone goes, and then the page reads the list again.
async function watchDevices() {
  // Once at the start, also with an iPhone in the link: the page needs its name and the other iPhones.
  await syncDevices();
  let wait = 1000;
  for (;;) {
    if (!device || !$('pickerGroup').hidden) {
      wait = (await syncDevices()) ? 1000 : Math.min(wait * 2, 10000);
    } else {
      wait = 1000;
    }
    await sleep(wait);
  }
}

// The screen size in points, from WDA. WDA may come up after this page, so retry until it answers.
let infoLoading = null;
function refreshInfo() {
  if (infoLoading) return;
  infoLoading = (async () => {
    for (;;) {
      if (!device) return;
      try {
        const r = await fetch(path('/info'), { headers: auth });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const s = await r.json();
        size = s; $('wrap').style.aspectRatio = s.width + '/' + s.height;
        return;
      } catch (e) { await sleep(2000); }
    }
  })().finally(() => { infoLoading = null; });
}

function status(kind, text) {
  $('dot').className = 'dot' + (kind === 'live' ? ' live' : kind === 'bad' ? ' bad' : '');
  $('state').textContent = text;
}
function action(text, error) { const a = $('action'); a.textContent = text; a.className = error ? 'error' : ''; }

// Phone points from a pointer event. WDA works in points, not pixels.
function pt(e) {
  const r = img.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * size.width, y: (e.clientY - r.top) / r.height * size.height,
           px: e.clientX - r.left, py: e.clientY - r.top };
}
async function send(kind, body, label) {
  if (!device) return action('Choose an iPhone first', true);
  const t = performance.now();
  action(label + '…');
  try {
    const r = await fetch(path('/' + kind), { method: 'POST', headers: auth, body: JSON.stringify(body || {}) });
    if (!r.ok) throw new Error(await r.text());
    action(label + ' ' + ((performance.now() - t) / 1000).toFixed(2) + ' s');
  } catch (e) { action(label + ' failed: ' + e.message, true); }
}

// Touch feedback
function ripple(px, py, hold) {
  const d = document.createElement('div');
  d.className = 'ripple' + (hold ? ' hold' : '');
  d.style.left = px + 'px'; d.style.top = py + 'px';
  $('wrap').appendChild(d); setTimeout(() => d.remove(), 500);
}
function trail(a, b) {
  const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  l.setAttribute('class', 'trail');
  l.setAttribute('x1', a.px); l.setAttribute('y1', a.py); l.setAttribute('x2', b.px); l.setAttribute('y2', b.py);
  overlay.appendChild(l); setTimeout(() => l.remove(), 550);
}

img.addEventListener('pointerdown', e => { down = { ...pt(e), t: Date.now() }; img.setPointerCapture(e.pointerId); });
img.addEventListener('pointerup', e => {
  if (!down) return;
  const u = pt(e), ms = Date.now() - down.t;
  if (Math.hypot(u.x - down.x, u.y - down.y) < 8) {
    const hold = ms > 450;
    ripple(down.px, down.py, hold);
    send('tap', { x: down.x, y: down.y, hold: hold ? Math.min(ms, 3000) : 60 }, hold ? 'long press' : 'tap');
  } else {
    trail(down, u); ripple(u.px, u.py);
    send('swipe', { x1: down.x, y1: down.y, x2: u.x, y2: u.y, ms: Math.max(120, Math.min(ms, 1500)) }, 'swipe');
  }
  down = null;
});

// Scroll wheel: gather the deltas for a moment, then send one swipe.
let wheel = null;
img.addEventListener('wheel', e => {
  e.preventDefault();
  if (!wheel) wheel = { start: pt(e), dx: 0, dy: 0 };
  wheel.dx += e.deltaX; wheel.dy += e.deltaY;
  clearTimeout(wheel.timer);
  wheel.timer = setTimeout(() => {
    const w = wheel; wheel = null;
    const clamp = (v, max) => Math.sign(v) * Math.min(Math.max(Math.abs(v) * 0.6, 40), max);
    const dy = Math.abs(w.dy) > 4 ? clamp(w.dy, size.height * 0.6) : 0;
    const dx = Math.abs(w.dx) > 4 ? clamp(w.dx, size.width * 0.6) : 0;
    if (!dx && !dy) return;
    const s = w.start, end = { x: s.x - dx, y: s.y - dy };
    const r = img.getBoundingClientRect();
    trail(s, { px: end.x / size.width * r.width, py: end.y / size.height * r.height });
    send('swipe', { x1: s.x, y1: s.y, x2: end.x, y2: end.y, ms: 220 }, 'scroll');
  }, 120);
}, { passive: false });

const commands = {
  home: () => send('home', {}, 'home'),
  back: () => send('swipe', { x1: 6, y1: size.height / 2, x2: size.width * 0.7, y2: size.height / 2, ms: 250 }, 'back'),
  switcher: () => send('switcher', {}, 'app switcher'),
  wake: () => send('wake', {}, 'wake'),
  shot: () => {
    if (!device) return action('Choose an iPhone first', true);
    action('screenshot…');
    const a = document.createElement('a'); a.href = path('/screenshot') + '?token=' + encodeURIComponent(TOKEN); a.click();
    setTimeout(() => action('screenshot downloaded'), 1500);
  },
};
for (const id in commands) $(id).onclick = commands[id];
$('wakeNow').onclick = commands.wake;

function setLocked(mode) {
  if (mode === locked) return;
  locked = mode;
  $('locked').style.display = mode ? 'flex' : 'none';
  $('lockedText').textContent = mode === 'unlock' ? 'Unlock the iPhone to control it.' : 'The iPhone is locked.';
  $('wakeNow').hidden = mode !== 'locked';
}
// Ask every 3 s while the page shows. The frames cannot tell: a locked iPhone can send none, or keep sending
// its last app screen. Also before the first frame, which a dark display never sends.
async function watchLock() {
  for (;;) {
    await sleep(3000);
    if (!device || document.hidden || $('paused').style.display === 'flex') continue;
    const asked = device;
    try {
      const r = await fetch(path('/locked'), { headers: auth, signal: AbortSignal.timeout(5000) });
      // Another iPhone may have been chosen while the answer came.
      if (!r.ok || asked !== device) continue;
      const s = await r.json();
      setLocked(!s.locked ? null : s.canWake ? 'locked' : 'unlock');
    } catch (e) {}
  }
}

const txt = $('txt');
$('send').onclick = () => {
  // An empty field sends Return, so you can submit a form on the phone.
  send('type', { text: txt.value || '\n' }, txt.value ? 'type' : 'return');
  txt.value = '';
};
txt.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); $('send').click(); }
  if (e.key === 'Escape') txt.blur();
});

const keys = { h: 'home', b: 'back', s: 'switcher', w: 'wake', p: 'shot' };
document.addEventListener('keydown', e => {
  if (e.target === txt || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); txt.focus(); return; }
  const c = keys[e.key.toLowerCase()];
  if (c) { e.preventDefault(); commands[c](); }
});

const sleep = ms => new Promise(f => setTimeout(f, ms));

// Decode the stream with WebCodecs and draw each frame at once.
// Messages: 4-byte length, 1 type byte (0 config, 1 key, 2 delta, 3 replaced, 4 stats), payload.
// The server sends stats only when the URL asks with stats=1. Skip any type not known here.
// Every 250 ms the page reports the bytes it has received, so that the host sees the stream
// still on the way, also in buffers it cannot see itself, such as an SSH tunnel.
class Refused extends Error {}

async function video() {
  videoRunning = true;
  const ctx = img.getContext('2d');
  for (;;) {
    if (!device) { videoRunning = false; return; }
    const gen = generation, stats = path('/stats');
    let dec = null, replaced = false, session = null, received = 0, reporting = false;
    let lastReport = { received: -1, at: 0 };
    const report = setInterval(async () => {
      // A report that is still on the way is enough. Do not queue more behind it.
      if (!session || reporting) return;
      // Nothing new arrived: skip, but report at least every 900 ms. The host counts a report
      // as fresh for 1 s.
      const now = performance.now();
      if (received === lastReport.received && now - lastReport.at < 900) return;
      lastReport = { received, at: now };
      reporting = true;
      try {
        // A report that takes longer than 1 s is stale anyway. The timeout also frees the next one.
        await fetch(stats, { method: 'POST', headers: auth, body: JSON.stringify({ session, received }),
                                signal: AbortSignal.timeout(1000) });
      } catch (e) {} finally { reporting = false; }
    }, 250);
    try {
      const r = await fetch(VIDEO_ORIGIN + path('/video') + '?token=' + encodeURIComponent(TOKEN) + '&stats=1', { cache: 'no-store' });
      // 404 and 409 say why, for example that the iPhone was unplugged.
      if (r.status === 404 || r.status === 409) throw new Refused(await r.text());
      if (!r.ok) throw new Error('HTTP ' + r.status);
      // The iPhone may have changed since the last connection.
      refreshInfo();
      const rd = reader = r.body.getReader();
      if (gen !== generation) rd.cancel().catch(() => {});
      let buf = new Uint8Array(0), off = 0, ts = 0, skip = false;
      for (;;) {
        const { value, done } = await rd.read();
        if (gen !== generation) throw new Error('another iPhone');
        if (done) throw new Error('stream ended');
        received += value.length;
        // Copy only when a message was cut between two chunks. Otherwise read the chunk in place.
        if (off < buf.length) {
          const rest = buf.length - off, nb = new Uint8Array(rest + value.length);
          nb.set(buf.subarray(off)); nb.set(value, rest); buf = nb;
        } else buf = value;
        off = 0;
        while (buf.length - off >= 5) {
          const n = ((buf[off] << 24) | (buf[off + 1] << 16) | (buf[off + 2] << 8) | buf[off + 3]) >>> 0;
          if (buf.length - off < 4 + n) break;
          const type = buf[off + 4], payload = buf.subarray(off + 5, off + 4 + n);
          off += 4 + n;
          if (type === 3) { replaced = true; throw new Error('replaced'); }
          if (type === 4) {
            // The encoder target. It falls below the settings while the link is congested.
            const st = JSON.parse(new TextDecoder().decode(payload));
            $('rate').textContent = Math.round(st.bitrate / 1000) + ' kbit/s';
            $('rate').title = 'Encoder target: ' + Math.round(st.bitrate / 1000) + ' kbit/s, ' + st.fps + ' fps';
            continue;
          }
          if (type === 0) {
            const cfg = JSON.parse(new TextDecoder().decode(payload));
            session = cfg.session || null;
            const conf = { codec: cfg.codec, optimizeForLatency: true };
            if (!(await VideoDecoder.isConfigSupported(conf)).supported) throw new Error(cfg.codec + ' is not supported by this browser');
            if (dec) dec.close();
            dec = new VideoDecoder({
              output: f => { ctx.drawImage(f, 0, 0, img.width, img.height); f.close(); count++; },
              // Leave the read loop, so that the page reconnects and starts again from a config and a key frame.
              error: e => { action('decoder error: ' + e.message, true); rd.cancel().catch(() => {}); },
            });
            dec.configure(conf);
            img.width = cfg.width; img.height = cfg.height;
            $('fmt').textContent = (cfg.codec.startsWith('hev') ? 'H.265' : 'H.264') + ' · ' + cfg.width + '×' + cfg.height;
            status('live', 'Live');
          } else if ((type === 1 || type === 2) && dec && dec.state === 'configured') {
            // If decoding falls behind, drop delta frames until the next key frame.
            // Delta frames depend on the frames before them, so skip all of them.
            if (type === 1) skip = false;
            else if (skip || dec.decodeQueueSize > 5) { skip = true; continue; }
            dec.decode(new EncodedVideoChunk({ type: type === 1 ? 'key' : 'delta', timestamp: ts += 33333, data: payload }));
          }
        }
      }
    } catch (e) {
      clearInterval(report);
      if (dec && dec.state !== 'closed') dec.close();
      // Another iPhone was chosen: connect to it at once.
      if (gen !== generation) { $('rate').textContent = ''; if (device) status('', 'Connecting…'); continue; }
      // A newer viewer took the stream. Stop here, so the two pages do not take it back and forth.
      if (replaced) {
        status('bad', 'Paused'); $('fps').textContent = ''; $('rate').textContent = ''; $('paused').style.display = 'flex';
        videoRunning = false;
        return;
      }
      status('bad', e instanceof Refused ? e.message + ' Retrying…' : 'Stream lost, retrying…');
      // The iPhone may be gone, or its id may have changed: look at the list now.
      syncDevices();
      await sleep(1000);
    }
  }
}

setInterval(() => { if ($('paused').style.display !== 'flex') $('fps').textContent = count + ' fps'; count = 0; }, 1000);
const named = params.get('device');
if (named) chooseDevice(named);
watchDevices();
watchLock();
</script>
